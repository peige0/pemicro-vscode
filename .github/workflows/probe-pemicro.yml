name: Probe PEmicro Update Site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-pemicro.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Hash exact Power plugin
        shell: pwsh
        run: |
          $u="https://www.pemicro.com/eclipse/updates/com.pemicro.debug.gdbjtag.ppc.updatesite/plugins/com.pemicro.debug.gdbjtag.ppc_2.0.5.202210261806.jar"
          & curl.exe -L --fail --retry 3 -o pemicro-power.jar $u
          $h=(Get-FileHash pemicro-power.jar -Algorithm SHA256).Hash.ToLower()
          $s=(Get-Item pemicro-power.jar).Length
          Write-Host "PEMICRO_SHA256=$h"
          Write-Host "PEMICRO_SIZE=$s"
          Expand-Archive pemicro-power.jar -DestinationPath p -Force
          & ".\p\win32\pegdbserver_power_console.exe" -h | Select-Object -First 6
