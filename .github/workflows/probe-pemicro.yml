name: Probe PEmicro Update Site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-pemicro.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - name: Probe Power update metadata
        shell: pwsh
        run: |
          $base = "https://www.pemicro.com/eclipse/updates/com.pemicro.debug.gdbjtag.ppc.updatesite"
          $urls = @(
            "$base/artifacts.xml",
            "$base/content.xml",
            "$base/site.xml",
            "$base/compositeArtifacts.xml",
            "$base/compositeContent.xml"
          )
          foreach ($u in $urls) {
            Write-Host "===== $u ====="
            & curl.exe -L --max-time 30 $u
            Write-Host ""
          }
