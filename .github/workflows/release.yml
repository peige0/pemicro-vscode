name: Publish VSIX Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "extension.js"
      - "resources/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$NAME-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      - name: Package VSIX
        run: vsce package --out "${{ steps.pkg.outputs.asset }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: MPC5777M PEmicro Debug & Flash v${{ steps.pkg.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.asset }}
          body: |
            VS Code extension v${{ steps.pkg.outputs.version }}.

            Flash operations use the PEmicro POWER GDB Server directly.
            This public VSIX does not redistribute NXP/PEmicro proprietary runtime binaries.
