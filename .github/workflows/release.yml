name: Publish VSIX Release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package VSIX
        run: vsce package --out mpc5777m-pemicro-debug-1.3.0.vsix

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: MPC5777M PEmicro Debug & Flash v1.3.0
          target_commitish: main
          generate_release_notes: true
          files: mpc5777m-pemicro-debug-1.3.0.vsix
          body: |
            VS Code extension v1.3.0.

            Flash operations use the PEmicro POWER GDB Server directly.
            This public VSIX does not redistribute NXP/PEmicro proprietary runtime binaries.
            Configure mpc5777mDebug.gdbPath and mpc5777mDebug.serverPath after installation,
            or build a private/offline bundle with scripts/prepare-runtime.ps1.
