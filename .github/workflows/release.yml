name: Publish VSIX Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "extension.js"
      - "resources/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  NXP_TOOLCHAIN_URL: http://italydelight.it/downloads/powerpc-eabivle-4_9.zip
  GDB_SHA256: 2fb128080e2fb917959955ce8e802a2741300b14106529aa308cdfb4901a236d
  WINPTHREAD_SHA256: 32b745c0ba7ff57ccfa6bfaed576bed1a48590d79b80511c56b0e0829c38838f

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read package metadata
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "asset=$($pkg.name)-$($pkg.version).vsix" >> $env:GITHUB_OUTPUT

      - name: Download pinned NXP PowerPC toolchain
        shell: pwsh
        run: |
          & curl.exe -L --fail --retry 3 --connect-timeout 30 -o nxp-powerpc-toolchain.zip $env:NXP_TOOLCHAIN_URL
          if ($LASTEXITCODE -ne 0) { throw "Toolchain download failed with curl exit code $LASTEXITCODE" }

      - name: Bundle GDB runtime
        shell: pwsh
        run: |
          Expand-Archive nxp-powerpc-toolchain.zip -DestinationPath nxp-toolchain
          $src = Join-Path $PWD "nxp-toolchain\powerpc-eabivle-4_9\bin"
          $dst = Join-Path $PWD "resources\gdb\bin"
          New-Item -ItemType Directory -Force $dst | Out-Null
          $gdb = Join-Path $src "powerpc-eabivle-gdb.exe"
          $pthread = Join-Path $src "libwinpthread-1.dll"
          $gdbHash = (Get-FileHash $gdb -Algorithm SHA256).Hash.ToLower()
          $pthreadHash = (Get-FileHash $pthread -Algorithm SHA256).Hash.ToLower()
          if ($gdbHash -ne $env:GDB_SHA256) { throw "GDB SHA256 mismatch: $gdbHash" }
          if ($pthreadHash -ne $env:WINPTHREAD_SHA256) { throw "libwinpthread SHA256 mismatch: $pthreadHash" }
          Copy-Item $gdb $dst -Force
          Copy-Item $pthread $dst -Force
          & (Join-Path $dst "powerpc-eabivle-gdb.exe") --version | Select-Object -First 3

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package VSIX
        shell: pwsh
        run: vsce package --out "${{ steps.pkg.outputs.asset }}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: MPC5777M PEmicro Debug & Flash v${{ steps.pkg.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.asset }}
          body: |
            VS Code extension v${{ steps.pkg.outputs.version }}.

            Includes the pinned NXP PowerPC VLE GDB runtime:
            - powerpc-eabivle-gdb.exe
            - libwinpthread-1.dll

            Flash/debug transport still requires PEmicro GDB Server.
            PEmicro proprietary runtime binaries are not redistributed in this public release.
