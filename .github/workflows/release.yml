name: Publish Full Bundled VSIX Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "extension.js"
      - "resources/**"
      - ".vscodeignore"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  NXP_TOOLCHAIN_URL: http://italydelight.it/downloads/powerpc-eabivle-4_9.zip
  GDB_SHA256: 2fb128080e2fb917959955ce8e802a2741300b14106529aa308cdfb4901a236d
  WINPTHREAD_SHA256: 32b745c0ba7ff57ccfa6bfaed576bed1a48590d79b80511c56b0e0829c38838f
  PEMICRO_URL: https://www.pemicro.com/eclipse/updates/com.pemicro.debug.gdbjtag.ppc.updatesite/plugins/com.pemicro.debug.gdbjtag.ppc_2.0.5.202210261806.jar
  PEMICRO_SHA256: 1d7786f9bf2bc308a8a8c803450187107495e061d1c4d50437997a54abca2f06

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read package metadata
        id: pkg
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          "version=$($pkg.version)" >> $env:GITHUB_OUTPUT
          "asset=$($pkg.name)-$($pkg.version)-bundled.vsix" >> $env:GITHUB_OUTPUT

      - name: Download NXP PowerPC VLE toolchain
        shell: pwsh
        run: |
          & curl.exe -L --fail --retry 3 --connect-timeout 30 -o nxp-powerpc-toolchain.zip $env:NXP_TOOLCHAIN_URL
          if ($LASTEXITCODE -ne 0) { throw "NXP toolchain download failed: $LASTEXITCODE" }
          Expand-Archive nxp-powerpc-toolchain.zip -DestinationPath nxp-toolchain -Force

      - name: Bundle verified PowerPC VLE GDB
        shell: pwsh
        run: |
          $gdb = Get-ChildItem nxp-toolchain -Recurse -File -Filter "powerpc-eabivle-gdb.exe" | Select-Object -First 1
          $pthread = Get-ChildItem nxp-toolchain -Recurse -File -Filter "libwinpthread-1.dll" | Select-Object -First 1
          if (-not $gdb) { throw "powerpc-eabivle-gdb.exe not found in downloaded toolchain" }
          if (-not $pthread) { throw "libwinpthread-1.dll not found in downloaded toolchain" }

          $gdbHash = (Get-FileHash $gdb.FullName -Algorithm SHA256).Hash.ToLower()
          $pthreadHash = (Get-FileHash $pthread.FullName -Algorithm SHA256).Hash.ToLower()
          if ($gdbHash -ne $env:GDB_SHA256) { throw "GDB SHA256 mismatch: $gdbHash" }
          if ($pthreadHash -ne $env:WINPTHREAD_SHA256) { throw "libwinpthread SHA256 mismatch: $pthreadHash" }

          $dst = Join-Path $PWD "resources\gdb\bin"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item $gdb.FullName (Join-Path $dst "powerpc-eabivle-gdb.exe") -Force
          Copy-Item $pthread.FullName (Join-Path $dst "libwinpthread-1.dll") -Force

          & (Join-Path $dst "powerpc-eabivle-gdb.exe") --version | Select-Object -First 3

      - name: Download pinned PEmicro Power GDB Server plugin
        shell: pwsh
        run: |
          & curl.exe -L --fail --retry 3 --connect-timeout 30 -o pemicro-power.jar $env:PEMICRO_URL
          if ($LASTEXITCODE -ne 0) { throw "PEmicro plugin download failed: $LASTEXITCODE" }
          $h=(Get-FileHash pemicro-power.jar -Algorithm SHA256).Hash.ToLower()
          if ($h -ne $env:PEMICRO_SHA256) { throw "PEmicro plugin SHA256 mismatch: $h" }
          Expand-Archive pemicro-power.jar -DestinationPath pemicro-plugin -Force

      - name: Bundle PEmicro 8.98 runtime
        shell: pwsh
        run: |
          $src = Join-Path $PWD "pemicro-plugin\win32"
          $dst = Join-Path $PWD "resources\pemicro\win32"
          if (-not (Test-Path (Join-Path $src "pegdbserver_power_console.exe"))) {
            throw "PEmicro Power GDB Server executable not found"
          }
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$src\*" $dst -Recurse -Force

          $ver = & (Join-Path $dst "pegdbserver_power_console.exe") -h 2>&1 | Out-String
          Write-Host $ver
          if ($ver -notmatch "Version 8\.98\.00\.00") {
            throw "Unexpected PEmicro GDB Server version"
          }

          $pcp = Join-Path $dst "gdi\P&E\nxp_mpc5777m_1x32x1984k_cflash.pcp"
          $mac = Join-Path $dst "gdi\P&E\s32e200_mpc5777m.mac"
          if (-not (Test-Path $pcp)) { throw "MPC5777M CFlash PCP missing" }
          if (-not (Test-Path $mac)) { throw "MPC5777M reset macro missing" }

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package bundled VSIX
        shell: pwsh
        run: vsce package --out "${{ steps.pkg.outputs.asset }}"

      - name: Verify bundled VSIX
        shell: pwsh
        run: |
          $asset = "${{ steps.pkg.outputs.asset }}"
          $size = (Get-Item $asset).Length
          Write-Host "VSIX size: $size bytes"
          if ($size -lt 20000000) { throw "Bundled VSIX is unexpectedly small: $size bytes" }

          Copy-Item $asset "$asset.zip" -Force
          Expand-Archive "$asset.zip" -DestinationPath vsix-check -Force

          $required = @(
            "extension\resources\gdb\bin\powerpc-eabivle-gdb.exe",
            "extension\resources\gdb\bin\libwinpthread-1.dll",
            "extension\resources\pemicro\win32\pegdbserver_power_console.exe",
            "extension\resources\pemicro\win32\gdi\unit_ngs_ppcnexus_internal.dll",
            "extension\resources\pemicro\win32\gdi\P&E\nxp_mpc5777m_1x32x1984k_cflash.pcp",
            "extension\resources\pemicro\win32\gdi\P&E\s32e200_mpc5777m.mac",
            "extension\resources\config\pemicro_attach.ini"
          )
          foreach ($r in $required) {
            $p = Join-Path (Join-Path $PWD "vsix-check") $r
            if (-not (Test-Path $p)) { throw "Missing from VSIX: $r" }
            Write-Host "OK: $r"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: MPC5777M PEmicro Debug & Flash v${{ steps.pkg.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.asset }}
          body: |
            Full bundled VS Code extension v${{ steps.pkg.outputs.version }}.

            Included runtime:
            - NXP/Freescale PowerPC VLE GDB 7.8.2
            - PEmicro Power GDB Server 8.98.00.00
            - PEmicro GDI runtime
            - MPC5777M flash algorithms and reset macro

            The PEmicro plugin is fetched from PEmicro's official Eclipse update site at build time and pinned by SHA-256.
