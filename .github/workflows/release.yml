name: Publish Full Bundled VSIX Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "extension.js"
      - "resources/**"
      - ".vscodeignore"
  workflow_dispatch:

permissions:
  contents: write

env:
  GDB_VERSION: "7.8.2"
  PEMICRO_URL: https://www.pemicro.com/eclipse/updates/com.pemicro.debug.gdbjtag.ppc.updatesite/plugins/com.pemicro.debug.gdbjtag.ppc_2.0.5.202210261806.jar
  PEMICRO_SHA256: 1d7786f9bf2bc308a8a8c803450187107495e061d1c4d50437997a54abca2f06

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$NAME-$VERSION-bundled.vsix" >> "$GITHUB_OUTPUT"

      - name: Generate release changelog
        shell: bash
        run: |
          VERSION="${{ steps.pkg.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          {
            echo "## Changes in v$VERSION"
            echo
            if [ -n "$PREV_TAG" ]; then
              git log --no-merges --pretty=format:'- %s (`%h`)' "$PREV_TAG"..HEAD
              echo
              echo
              echo "### Changed files"
              echo
              git diff --stat "$PREV_TAG"..HEAD | sed 's/^/    /'
            else
              git log -20 --no-merges --pretty=format:'- %s (`%h`)'
            fi
          } > release-notes.md

          echo "Generated release notes:"
          cat release-notes.md

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip curl

      - name: Reuse verified bundled GDB 7.8.2
        shell: bash
        run: |
          GDB_SEED_URL="https://github.com/peige0/pemicro-vscode/releases/download/v1.3.8/mpc5777m-pemicro-debug-1.3.8-bundled.vsix"
          GDB_SEED_SHA256="7413ba613ac4efd65b6062415abc974897bd79a96ce6504985a9cb9cc72968ec"
          curl -L --fail --retry 3 --connect-timeout 30 -o gdb-seed.vsix "$GDB_SEED_URL"
          ACTUAL=$(sha256sum gdb-seed.vsix | awk '{print $1}')
          if [ "$ACTUAL" != "$GDB_SEED_SHA256" ]; then
            echo "Seed VSIX SHA256 mismatch: $ACTUAL"
            exit 1
          fi
          mkdir -p gdb-seed resources/gdb/bin
          unzip -q gdb-seed.vsix -d gdb-seed
          cp gdb-seed/extension/resources/gdb/bin/powerpc-eabivle-gdb.exe resources/gdb/bin/
          if [ -f gdb-seed/extension/resources/gdb/bin/libwinpthread-1.dll ]; then
            cp gdb-seed/extension/resources/gdb/bin/libwinpthread-1.dll resources/gdb/bin/
          fi
          test -s resources/gdb/bin/powerpc-eabivle-gdb.exe
          echo "Reused verified GDB; source compilation skipped."

      - name: Download full PEmicro Power plugin
        shell: bash
        run: |
          curl -L --fail --retry 3 --connect-timeout 30 -o pemicro-power.jar "$PEMICRO_URL"
          ACTUAL=$(sha256sum pemicro-power.jar | awk '{print $1}')
          if [ "$ACTUAL" != "$PEMICRO_SHA256" ]; then
            echo "PEmicro SHA256 mismatch: $ACTUAL"
            exit 1
          fi
          mkdir pemicro-plugin
          unzip -q pemicro-power.jar -d pemicro-plugin

      - name: Build single-file full PEmicro runtime archive
        shell: bash
        run: |
          test -f pemicro-plugin/win32/pegdbserver_power_console.exe
          test -f "pemicro-plugin/win32/gdi/unit_ngs_ppcnexus_internal.dll"
          test -f "pemicro-plugin/win32/gdi/P&E/nxp_mpc5777m_1x32x1984k_cflash.pcp"
          test -f "pemicro-plugin/win32/gdi/P&E/s32e200_mpc5777m.mac"
          mkdir -p resources/pemicro
          (
            cd pemicro-plugin
            zip -q -r -9 ../resources/pemicro/pemicro-power-win32.zip win32
          )
          RUNTIME_SIZE=$(stat -c%s resources/pemicro/pemicro-power-win32.zip)
          echo "Full PEmicro runtime archive: $RUNTIME_SIZE bytes"
          if [ "$RUNTIME_SIZE" -lt 15000000 ]; then
            echo "Full PEmicro runtime archive unexpectedly small"
            exit 1
          fi

      - name: Clean temporary build inputs
        shell: bash
        run: |
          rm -rf gdb-seed pemicro-plugin
          rm -f gdb-seed.vsix pemicro-power.jar

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package bundled VSIX
        run: vsce package --out "${{ steps.pkg.outputs.asset }}"

      - name: Verify bundled VSIX
        shell: bash
        run: |
          ASSET="${{ steps.pkg.outputs.asset }}"
          SIZE=$(stat -c%s "$ASSET")
          echo "VSIX size: $SIZE bytes"
          if [ "$SIZE" -lt 20000000 ]; then
            echo "Bundled VSIX is unexpectedly small: $SIZE"
            exit 1
          fi

          rm -rf vsix-check runtime-check
          mkdir vsix-check runtime-check
          unzip -q "$ASSET" -d vsix-check

          test -f "vsix-check/extension/resources/gdb/bin/powerpc-eabivle-gdb.exe"
          test -f "vsix-check/extension/resources/pemicro/pemicro-power-win32.zip"
          test -f "vsix-check/extension/resources/config/pemicro_attach.ini"

          unzip -q "vsix-check/extension/resources/pemicro/pemicro-power-win32.zip" -d runtime-check
          required=(
            "win32/pegdbserver_power_console.exe"
            "win32/gdi/unit_ngs_ppcnexus_internal.dll"
            "win32/gdi/P&E/nxp_mpc5777m_1x32x1984k_cflash.pcp"
            "win32/gdi/P&E/s32e200_mpc5777m.mac"
          )
          for f in "${required[@]}"; do
            test -f "runtime-check/$f" || { echo "Missing runtime file: $f"; exit 1; }
            echo "OK: $f"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: MPC5777M PEmicro Debug & Flash v${{ steps.pkg.outputs.version }}
          target_commitish: main
          body_path: release-notes.md
          files: ${{ steps.pkg.outputs.asset }}

      - name: Publish VS Code Marketplace (optional)
        if: ${{ env.VSCE_PAT != '' }}
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          vsce publish --packagePath "${{ steps.pkg.outputs.asset }}" -p "$VSCE_PAT"
