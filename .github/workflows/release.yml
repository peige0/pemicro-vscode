name: Publish Full Bundled VSIX Release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "extension.js"
      - "resources/**"
      - ".vscodeignore"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  GDB_VERSION: "7.8.2"
  PEMICRO_URL: https://www.pemicro.com/eclipse/updates/com.pemicro.debug.gdbjtag.ppc.updatesite/plugins/com.pemicro.debug.gdbjtag.ppc_2.0.5.202210261806.jar
  PEMICRO_SHA256: 1d7786f9bf2bc308a8a8c803450187107495e061d1c4d50437997a54abca2f06

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Read package metadata
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$NAME-$VERSION-bundled.vsix" >> "$GITHUB_OUTPUT"

      - name: Install GDB cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 make gcc g++ texinfo bison flex wget xz-utils

      - name: Download GNU GDB source
        run: |
          wget -q "https://ftp.gnu.org/gnu/gdb/gdb-$GDB_VERSION.tar.xz"
          tar -xf "gdb-$GDB_VERSION.tar.xz"

      - name: Build Windows PowerPC VLE GDB
        shell: bash
        run: |
          mkdir gdb-build
          cd gdb-build
          "../gdb-$GDB_VERSION/configure"             --host=x86_64-w64-mingw32             --target=powerpc-eabivle             --disable-werror             --disable-nls             --without-python             --without-expat             --disable-tui             --disable-sim
          make -j2 all-gdb
          x86_64-w64-mingw32-strip --strip-unneeded gdb/gdb.exe
          file gdb/gdb.exe
          x86_64-w64-mingw32-objdump -p gdb/gdb.exe | grep "DLL Name" || true

      - name: Bundle GDB runtime
        shell: bash
        run: |
          mkdir -p resources/gdb/bin
          cp gdb-build/gdb/gdb.exe resources/gdb/bin/powerpc-eabivle-gdb.exe

          PTHREAD=$(find /usr -type f -name libwinpthread-1.dll 2>/dev/null | head -n 1 || true)
          if [ -n "$PTHREAD" ]; then
            cp "$PTHREAD" resources/gdb/bin/libwinpthread-1.dll
          fi

          test -s resources/gdb/bin/powerpc-eabivle-gdb.exe
          GDB_SIZE=$(stat -c%s resources/gdb/bin/powerpc-eabivle-gdb.exe)
          echo "Bundled GDB size: $GDB_SIZE"
          if [ "$GDB_SIZE" -lt 3000000 ]; then
            echo "GDB unexpectedly small"
            exit 1
          fi

      - name: Download pinned PEmicro Power GDB Server 8.98
        shell: bash
        run: |
          curl -L --fail --retry 3 --connect-timeout 30 -o pemicro-power.jar "$PEMICRO_URL"
          ACTUAL=$(sha256sum pemicro-power.jar | awk '{print $1}')
          if [ "$ACTUAL" != "$PEMICRO_SHA256" ]; then
            echo "PEmicro SHA256 mismatch: $ACTUAL"
            exit 1
          fi
          mkdir pemicro-plugin
          unzip -q pemicro-power.jar -d pemicro-plugin

      - name: Bundle PEmicro runtime
        shell: bash
        run: |
          test -f pemicro-plugin/win32/pegdbserver_power_console.exe
          mkdir -p resources/pemicro/win32
          cp -a pemicro-plugin/win32/. resources/pemicro/win32/

          test -f "resources/pemicro/win32/gdi/unit_ngs_ppcnexus_internal.dll"
          test -f "resources/pemicro/win32/gdi/P&E/nxp_mpc5777m_1x32x1984k_cflash.pcp"
          test -f "resources/pemicro/win32/gdi/P&E/s32e200_mpc5777m.mac"

      - name: Install VSCE
        run: npm install --global @vscode/vsce

      - name: Package bundled VSIX
        run: vsce package --out "${{ steps.pkg.outputs.asset }}"

      - name: Verify bundled VSIX
        shell: bash
        run: |
          ASSET="${{ steps.pkg.outputs.asset }}"
          SIZE=$(stat -c%s "$ASSET")
          echo "VSIX size: $SIZE bytes"
          if [ "$SIZE" -lt 20000000 ]; then
            echo "Bundled VSIX is unexpectedly small: $SIZE"
            exit 1
          fi

          rm -rf vsix-check
          mkdir vsix-check
          unzip -q "$ASSET" -d vsix-check

          required=(
            "extension/resources/gdb/bin/powerpc-eabivle-gdb.exe"
            "extension/resources/pemicro/win32/pegdbserver_power_console.exe"
            "extension/resources/pemicro/win32/gdi/unit_ngs_ppcnexus_internal.dll"
            "extension/resources/pemicro/win32/gdi/P&E/nxp_mpc5777m_1x32x1984k_cflash.pcp"
            "extension/resources/pemicro/win32/gdi/P&E/s32e200_mpc5777m.mac"
            "extension/resources/config/pemicro_attach.ini"
          )
          for f in "${required[@]}"; do
            if [ ! -f "vsix-check/$f" ]; then
              echo "Missing from VSIX: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: MPC5777M PEmicro Debug & Flash v${{ steps.pkg.outputs.version }}
          target_commitish: main
          generate_release_notes: true
          files: ${{ steps.pkg.outputs.asset }}
          body: |
            Full bundled VS Code extension v${{ steps.pkg.outputs.version }}.

            Included:
            - reproducibly built GNU GDB 7.8.2, target powerpc-eabivle, Windows x64
            - PEmicro Power GDB Server 8.98.00.00
            - PEmicro GDI runtime
            - MPC5777M flash algorithms and reset macro

            GDB is built from GNU source during CI. The PEmicro plugin is fetched from the official PEmicro Eclipse update site and pinned by SHA-256.
